syntax = "proto3";

message Requisicao {
  string operacao = 1;
  string usuario = 2;
  string canal = 3;
  int64 timestamp = 4;
  string mensagem = 5;
  int64 relogio = 6;
}

message Resposta {
  string operacao = 1;
  bool sucesso = 2;
  string erro = 3;
  repeated string canais = 4;
  string servidor = 5;
  int64 timestamp = 6;
  int64 relogio = 7;
}

message Publicacao {
  string canal = 1;
  string usuario = 2;
  string mensagem = 3;
  string servidor = 4;
  int64 timestamp = 5;
  int64 relogio = 6;
}

message InfoServidor {
  string nome = 1;
  int32 rank = 2;
}

message ReqReferencia {
  string operacao = 1;
  string nome = 2;
  int64 timestamp = 3;
  int64 relogio = 4;
}

message RepReferencia {
  string operacao = 1;
  int32 rank = 2;
  repeated InfoServidor servidores = 3;
  string status = 4;
  int64 timestamp = 5;
  int64 relogio = 6;
}

message ReqServidor {
  string operacao = 1;
  string remetente = 2;
  int32 rank = 3;
  int64 timestamp = 4;
  int64 relogio = 5;
}

message RepServidor {
  string operacao = 1;
  string status = 2;
  int64 timestamp = 3;
  int64 relogio = 4;
}

message Replica {
  string tipo = 1;
  string servidor = 2;
  string usuario = 3;
  string canal = 4;
  string mensagem = 5;
  int64 timestamp = 6;
  int64 ts_requisicao = 7;
  int64 relogio = 8;
}